[package]
name = "rafland"
version = "0.1.0"
edition = "2021"
description = "RafLand - Dynamic Island bergaya kaca (glass) untuk Windows"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false }

[profile.release]
opt-level = 3
lto = true
strip = true
